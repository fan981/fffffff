<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻资讯</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        
        .news-container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        
        .channel {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 20px;
            font-size: 16px;
        }
        
        hr {
            border: none;
            height: 1px;
            background-color: #ddd;
            margin: 20px 0;
        }
        
        .content-wrapper {
            display: flex;
            gap: 30px;
        }
        
        .main-news {
            flex: 2;
        }
        
        .hot-news {
            flex: 1;
        }
        
        .news-item {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        
        .news-item:last-child {
            border-bottom: none;
        }
        
        h4 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .news-images {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .news-images img {
            width: 48%;
            height: auto;
            border-radius: 4px;
            object-fit: cover;
        }
        
        .author {
            font-size: 14px;
            color: #7f8c8d;
        }
        
        .hot-news h3 {
            color: #e74c3c;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .hot-item {
            margin-bottom: 20px;
        }
        
        .hot-item a {
            color: #e74c3c;
            text-decoration: none;
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }
        
        .hot-item a:hover {
            text-decoration: underline;
        }
        
        .hot-item img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="news-container">
        <h1>太空探索</h1>
        <p class="channel">频道 · 解读</p>
        <hr>
        
        <div class="content-wrapper">
            <div class="main-news">
                <div class="news-item">
                    <h4>飞行了200多亿公里的旅行者号，为何不担心撞上太空中的小行星</h4>
                    <div class="news-images">
                        <img src="voyager1.jpg" alt="火箭发射">
                        <img src="asteroid.jpg" alt="旅行者号">
                    </div>
                    <p class="author">寻巧资讯&emsp;+关注</p>
                </div>
                
                <div class="news-item">
                    <h4>欧洲探测器从4亿公里外传回多张照片</h4>
                    <div class="news-images">
                        <img src="mars1.jpg" alt="小行星带">
                        <img src="mars2.jpg" alt="探测器">
                    </div>
                    <p class="author">寻巧咨询&emsp;+关注</p>
                </div>
                
                <div class="news-item">
                    <h4>为什么太空没有氧气，陨石仍然能够燃烧</h4>
                    <div class="news-images">
                        <img src="rocket1.jpg" alt="陨石燃烧">
                        <img src="rocket2.jpg" alt="陨石">
                    </div>
                    <p class="author">寻巧咨询&emsp;+关注</p>
                </div>
            </div>
            
            <div class="hot-news">
                <h3>热文推荐</h3>
                <div class="hot-item">
                    <a href="#">研究发现：人类的自然寿命为120岁</a>
                    <img src="longevity.jpg" alt="长寿研究">
                </div>
                
                <div class="hot-item">
                    <a href="#">白墙脏了不用刷，一个小妙招，立马干净如新</a>
                    <img src="clean.jpg" alt="清洁技巧">
                </div>
                
                <div class="hot-item">
                    <a href="#">"八月十二用一张"，回家试试就知道，一套餐具放水里</a>
                    <img src="lifehack.jpg" alt="生活小窍门">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
